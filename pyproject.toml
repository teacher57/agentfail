[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentfail"
version = "0.1.0"
description = "Rule-based failure analyzer and regression gate for τ-bench / τ² agent transcripts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentfail = "agentfail.cli:main"

[tool.setuptools]
packages = ["agentfail"]
